# Local-only Galaxy game and Nakama hosts on the Laravel DDEV web
# container. DDEV's router forwards any *.ddev.site hostname to this
# container, so each service gets its own name-based server block on the
# standard ports - no custom exposed ports anywhere.
#
# Nakama itself runs as a DDEV service (docker-compose.nakama.yaml), so the
# blocks below reach it by its service name on the DDEV network instead of
# through a published host port. Docker's embedded resolver is queried at
# request time (set + $variable) rather than at config load, so nginx
# starts fine even when Nakama isn't up yet.

# The built HTML5 game (docker-compose.game-proxy.yaml mounts Galaxy/build
# over /var/www/galaxy-game), served behind the website's login exactly like
# play.fig.limited in production. The root below is the Defold editor's
# HTML5 launch dir, which is re-created on every build without disturbing
# the bind mount.
server {
    listen 80;
    listen 443 ssl;
    server_name play.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nakama_api http://nakama:7350;

    root /var/www/galaxy-game/default_html5/__htmlLaunchDir/Galaxy;
    index index.html;

    # The game asks its own origin for a play token; translate that to
    # Laravel's /play/token route, passing along the shared session cookie
    # (SESSION_DOMAIN=.ddev.site) and forcing the website's host so Laravel
    # routes/URL-generate as galaxy.ddev.site.
    location = /play-token {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /play/token;
        fastcgi_param QUERY_STRING "";
        fastcgi_param HTTP_HOST galaxy.ddev.site;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_ACCEPT application/json;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        add_header Cache-Control "no-store";
    }

    location = /_auth {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /play/auth-check;
        fastcgi_param QUERY_STRING "";
        fastcgi_param HTTP_HOST galaxy.ddev.site;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_ACCEPT application/json;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
    }

    location /socket {
        proxy_pass $nakama_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location @login {
        return 302 https://galaxy.ddev.site/login;
    }
}

# The local Nakama server's public API and WebSocket - what the game's
# registered server record (galaxy:server local) points players at.
# TLS is terminated here with DDEV's certificate.
server {
    listen 80;
    listen 443 ssl;
    server_name nakama.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nakama_api http://nakama:7350;

    location / {
        proxy_pass $nakama_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# Nakama's admin console.
server {
    listen 80;
    listen 443 ssl;
    server_name nakama-console.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nakama_console http://nakama:7351;

    location / {
        proxy_pass $nakama_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
