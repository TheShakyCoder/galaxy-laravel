# Local-only Galaxy game host on the Laravel DDEV web container.
server {
    listen 8765;
    listen [::]:8765;
    server_name galaxy.ddev.site play.ddev.site;

    root /var/www/galaxy-game;
    index index.html;

    location = /play-token {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /play/token;
        fastcgi_param QUERY_STRING "";
        fastcgi_param HTTP_HOST galaxy.ddev.site;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_ACCEPT application/json;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        add_header Cache-Control "no-store";
    }

    location = /_auth {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /play/auth-check;
        fastcgi_param QUERY_STRING "";
        fastcgi_param HTTP_HOST galaxy.ddev.site;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_ACCEPT application/json;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
    }

    location /socket {
        proxy_pass http://host.docker.internal:7350;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location @login {
        return 302 https://galaxy.ddev.site/login;
    }
}

# TLS is terminated by DDEV's router on galaxy.ddev.site:7354. Forward the
# Nakama HTTP API and WebSocket traffic to the local Docker-published port.
server {
    listen 8749;
    listen [::]:8749;
    server_name _;

    location / {
        proxy_pass http://host.docker.internal:7350;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
