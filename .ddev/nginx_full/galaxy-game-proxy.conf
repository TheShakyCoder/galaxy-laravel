# Local-only Galaxy game and Nakama hosts on the Laravel DDEV web
# container. DDEV's router forwards any *.ddev.site hostname to this
# container, so each service gets its own name-based server block on the
# standard ports - no custom exposed ports anywhere.
#
# Nakama is installed separately (~/Sites/galaxy-nakama) and publishes its
# ports on the host, so the blocks below reach it through
# host.docker.internal: world 1 on 7350 (API/WebSocket) and 7351 (console),
# world 2 on 7450.

# Each world's Nakama, and which one a game host's /socket reaches. Named
# upstreams let proxy_pass take a variable without a DNS resolver.
upstream galaxy_world1 { server host.docker.internal:7350; }
upstream galaxy_world2 { server host.docker.internal:7450; }
map $host $galaxy_world {
    play2.ddev.site galaxy_world2;
    default         galaxy_world1;
}

# The Godot game's web export (docker-compose.game-proxy.yaml mounts
# ~/Godot/galaxy-flyers/build over /var/www/galaxy-game), served behind the
# website's login exactly like play.fig.limited in production. play2 is the
# same game: the second world's Play address. Which world it signs in to
# comes from the website (the server chosen on the dashboard), not the host.
server {
    listen 80;
    listen 443 ssl;
    server_name play.ddev.site play2.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    root /var/www/galaxy-game/web;
    index index.html;

    # Godot's web export. Threads are off in its export preset, so no
    # COOP/COEP (cross-origin isolation) headers are needed.
    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream pck;
        image/png png;
        image/x-icon ico;
    }

    # The game asks its own origin for a play token; translate that to
    # Laravel's /play/token route, passing along the shared session cookie
    # (SESSION_DOMAIN=.ddev.site) and forcing the website's host so Laravel
    # routes/URL-generate as galaxy.ddev.site.
    location = /play-token {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /play/token;
        fastcgi_param QUERY_STRING "";
        fastcgi_param HTTP_HOST galaxy.ddev.site;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_ACCEPT application/json;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        add_header Cache-Control "no-store";
    }

    location = /_auth {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /play/auth-check;
        fastcgi_param QUERY_STRING "";
        fastcgi_param HTTP_HOST galaxy.ddev.site;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_ACCEPT application/json;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
    }

    location /socket {
        proxy_pass http://$galaxy_world;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location @login {
        return 302 https://galaxy.ddev.site/login;
    }
}

# The local Nakama server's public API and WebSocket - what the website's
# `local` game server row points players at. TLS is terminated here with
# DDEV's certificate.
server {
    listen 80;
    listen 443 ssl;
    server_name nakama.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    location / {
        proxy_pass http://galaxy_world1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# The second local game world's Nakama (server row `local2`).
server {
    listen 80;
    listen 443 ssl;
    server_name nakama2.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    location / {
        proxy_pass http://galaxy_world2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# Nakama's admin console.
server {
    listen 80;
    listen 443 ssl;
    server_name nakama-console.ddev.site;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    location / {
        proxy_pass http://host.docker.internal:7351;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
