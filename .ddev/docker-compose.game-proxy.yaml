# The Godot game's web export (~/Godot/galaxy-flyers/build/web), served as
# play.ddev.site. Mounts the whole build/ directory, not build/web: a
# re-export recreates build/web, which would leave a directory bind mount
# dangling (nginx 404s until `ddev restart`).
services:
  web:
    volumes:
      - ../../../Godot/galaxy-flyers/build:/var/www/galaxy-game:ro
